      - "7170:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - NODE_ID=5
      - NODE_URL=paxos-node-5:8080
      - CLUSTER_NODES=paxos-node-1:8080,paxos-node-2:8080,paxos-node-3:8080,paxos-node-4:8080
    volumes:
      - node5-data:/app/data
    networks:
      - paxos-network

networks:
  paxos-network:
    driver: bridge

volumes:
