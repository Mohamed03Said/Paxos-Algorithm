      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - NODE_ID=4
      - NODE_URL=paxos-node-4:8080
      - CLUSTER_NODES=paxos-node-1:8080,paxos-node-2:8080,paxos-node-3:8080,paxos-node-5:8080
    volumes:
      - node4-data:/app/data
    networks:
      - paxos-network

  paxos-node-5:
    image: paxos-node
    build:
      context: .
      dockerfile: PaxosAlgorithm/Dockerfile
    container_name: paxos-node-5
