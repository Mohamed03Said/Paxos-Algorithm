services:

  paxos-node-1:
    image: paxos-node
    build:
      context: .
      dockerfile: PaxosAlgorithm/Dockerfile
    container_name: paxos-node-1
    ports:
      - "7166:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - NODE_ID=1
      - NODE_URL=paxos-node-1:8080
      - CLUSTER_NODES=paxos-node-2:8080,paxos-node-3:8080,paxos-node-4:8080,paxos-node-5:8080
    volumes:
      - node1-data:/app/data
    networks:
      - paxos-network

  paxos-node-2:
    image: paxos-node
    build:
      context: .
      dockerfile: PaxosAlgorithm/Dockerfile
    container_name: paxos-node-2
